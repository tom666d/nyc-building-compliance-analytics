[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-building-compliance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34.2,<3",
  "snowflake-connector-python>=5.2.0,<6",
  "python-dotenv>=1.2.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0,<10",
  "PyYAML>=6.0.3,<7",
  "ruff>=0.17.4,<1",
  "dbt-core>=1.12.6,<1.13",
  "dbt-snowflake>=1.12.5,<1.13",
]
airflow = [
  "apache-airflow==3.4.0",
  "apache-airflow-providers-standard>=1.21.0,<2",
]

[project.scripts]
nyc-dob-extract = "nyc_dob_ingestion.extract_cli:main"
nyc-dob-ingest = "nyc_dob_ingestion.cli:main"
nyc-dob-snowflake-check = "nyc_dob_ingestion.snowflake_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
