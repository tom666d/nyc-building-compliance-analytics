[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-building-compliance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "snowflake-connector-python>=3.12,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "dbt-core>=1.9,<1.10",
  "dbt-snowflake>=1.9,<1.10",
]
airflow = ["apache-airflow>=2.10,<3"]

[project.scripts]
nyc-dob-extract = "nyc_dob_ingestion.extract_cli:main"
nyc-dob-ingest = "nyc_dob_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
