name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-and-dbt-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check src tests airflow
      - run: pytest
      - name: Resolve dbt packages
        working-directory: dbt/nyc_building_compliance
        run: dbt deps
      - name: Parse dbt graph
        working-directory: dbt/nyc_building_compliance
        env:
          SNOWFLAKE_ACCOUNT: placeholder
          SNOWFLAKE_USER: placeholder
          SNOWFLAKE_PASSWORD: placeholder
        run: dbt parse --profiles-dir .

  snowflake-integration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: snowflake-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[dev]'
      - working-directory: dbt/nyc_building_compliance
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DBT_ROLE: NYC_DOB_TRANSFORMER
          SNOWFLAKE_SCHEMA: "CI_${{ github.event.pull_request.number }}"
        run: dbt deps && dbt build --profiles-dir .
