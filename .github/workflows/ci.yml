name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SNOWFLAKE_ACCOUNT: static-validation
  SNOWFLAKE_USER: static-validation
  SNOWFLAKE_PASSWORD: not-a-real-secret

jobs:
  static-validation:
    name: Python, dbt, and Airflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install project dependencies
        run: make install

      - name: Validate workflow security contract
        run: make ci-workflow-check

      - name: Lint Python
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Check Python dependency consistency
        run: .venv/bin/pip check

      - name: Resolve dbt packages
        run: make dbt-deps

      - name: Parse dbt graph without a warehouse connection
        run: make dbt-parse

      - name: Validate Airflow Dag structure
        run: |
          make airflow-check
          .airflow-venv/bin/pip check

      - name: Validate and build dashboard
        run: |
          make dashboard-install
          make dashboard-check
