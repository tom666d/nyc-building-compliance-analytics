version: 2

sources:
  - name: dob_raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'NYC_DOB_ANALYTICS') }}"
    schema: raw
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: permits
        identifier: raw_dob_now_permits
        columns:
          - name: source_row_hash
            data_tests: [not_null]
          - name: load_id
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
      - name: complaints
        identifier: raw_dob_complaints
        columns:
          - name: source_row_hash
            data_tests: [not_null]
          - name: load_id
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
      - name: violations
        identifier: raw_dob_violations
        columns:
          - name: source_row_hash
            data_tests: [not_null]
          - name: load_id
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
