version: 2

models:
  - name: stg_dob_now_permits
    description: >-
      One row per exact DOB NOW permit source payload. Distinct source rows are retained
      because live profiling did not find a trustworthy permit natural key.
    columns:
      - name: permit_key
        description: Technical content key equal to the canonical source-row SHA-256 hash.
        data_tests: [not_null, unique]
      - name: bin
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "regexp '^[0-9]{7}$'"
      - name: borough
        data_tests:
          - accepted_values:
              arguments:
                values: ['MANHATTAN', 'BRONX', 'BROOKLYN', 'QUEENS', 'STATEN ISLAND']
  - name: stg_dob_complaints
    description: Latest source state for each DOB complaint.
    columns:
      - name: complaint_key
        data_tests: [not_null, unique]
      - name: complaint_number
        data_tests: [not_null]
      - name: borough
        data_tests:
          - accepted_values:
              arguments:
                values: ['MANHATTAN', 'BRONX', 'BROOKLYN', 'QUEENS', 'STATEN ISLAND']
  - name: stg_dob_violations
    description: Latest source state for each legacy BIS DOB violation.
    columns:
      - name: violation_key
        data_tests: [not_null, unique]
      - name: source_violation_id
        data_tests: [not_null]
      - name: issue_date_parse_failed
        description: True when a non-null source issue date fails the documented YYYYMMDD rule.
        data_tests: [not_null]
      - name: borough
        data_tests:
          - accepted_values:
              arguments:
                values: ['MANHATTAN', 'BRONX', 'BROOKLYN', 'QUEENS', 'STATEN ISLAND']
