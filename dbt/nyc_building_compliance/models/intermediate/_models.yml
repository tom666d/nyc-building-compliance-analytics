version: 2

models:
  - name: int_building_observations
    description: >-
      Union of valid-BIN building observations from permits, complaints, and violations.
      This model preserves repeated observations so dim_buildings can select documented
      current attributes without joining event facts to one another.
    columns:
      - name: bin
        data_tests: [not_null]
      - name: record_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['permit', 'complaint', 'violation']
      - name: source_priority
        description: Deterministic source preference used only after attribute completeness.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
